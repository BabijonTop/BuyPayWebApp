<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyPay</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div>
            <div class="logo">Buy<span>Pay</span></div>

            <p class="welcome" id="welcomeText">
                Xush kelibsiz!
            </p>
        </div>

        <div class="profile" id="profile">
            👤
        </div>
    </header>


    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <section class="hero">

            <div>
                <p class="hero-small">
                    BUY GAME CURRENCY
                </p>

                <h1>
                    Игровая валюта<br>
                    быстро и удобно
                </h1>

                <p class="hero-description">
                    Выбирай игру, пакет и оформляй заказ прямо в Telegram.
                </p>
            </div>

            <div class="hero-icon">
                🎮
            </div>

        </section>


        <!-- GAMES -->
        <section class="section">

            <div class="section-title">
                <h2>
                    Выберите игру
                </h2>
            </div>

            <div class="games">

                <button
                    class="game-card"
                    onclick="selectGame('PUBG Mobile')"
                >
                    <div class="game-icon pubg">
                        P
                    </div>

                    <div>
                        <strong>
                            PUBG Mobile
                        </strong>

                        <small>
                            UC
                        </small>
                    </div>
                </button>


                <button
                    class="game-card"
                    onclick="selectGame('Mobile Legends')"
                >
                    <div class="game-icon ml">
                        M
                    </div>

                    <div>
                        <strong>
                            Mobile Legends
                        </strong>

                        <small>
                            Diamonds
                        </small>
                    </div>
                </button>


                <button
                    class="game-card"
                    onclick="selectGame('Free Fire')"
                >
                    <div class="game-icon ff">
                        F
                    </div>

                    <div>
                        <strong>
                            Free Fire
                        </strong>

                        <small>
                            Diamonds
                        </small>
                    </div>
                </button>


                <button
                    class="game-card"
                    onclick="selectGame('Brawl Stars')"
                >
                    <div class="game-icon bs">
                        B
                    </div>

                    <div>
                        <strong>
                            Brawl Stars
                        </strong>

                        <small>
                            Gems
                        </small>
                    </div>
                </button>

            </div>

        </section>


        <!-- ORDER -->
        <section
            class="section order-section"
            id="orderSection"
        >

            <div class="section-title">

                <h2>
                    Покупка
                </h2>

            </div>


            <!-- SELECTED GAME -->

            <div class="selected-game">

                <span>
                    Выбрана игра:
                </span>

                <strong id="selectedGame">
                    Не выбрана
                </strong>

            </div>


            <!-- PACKAGES -->

            <div class="packages">

                <button
                    class="package"
                    onclick="selectPackage(this, 60, 12000)"
                >
                    <strong>
                        60 UC
                    </strong>

                    <span>
                        12 000 сум
                    </span>
                </button>


                <button
                    class="package"
                    onclick="selectPackage(this, 325, 55000)"
                >
                    <strong>
                        325 UC
                    </strong>

                    <span>
                        55 000 сум
                    </span>
                </button>


                <button
                    class="package"
                    onclick="selectPackage(this, 660, 105000)"
                >
                    <strong>
                        660 UC
                    </strong>

                    <span>
                        105 000 сум
                    </span>
                </button>


                <button
                    class="package"
                    onclick="selectPackage(this, 1800, 270000)"
                >
                    <strong>
                        1800 UC
                    </strong>

                    <span>
                        270 000 сум
                    </span>
                </button>

            </div>


            <!-- PLAYER ID -->

            <div class="input-box">

                <label for="playerId">
                    ID игрока
                </label>

                <input
                    id="playerId"
                    type="text"
                    placeholder="Введите ID игрока"
                    autocomplete="off"
                >

            </div>


            <!-- SUMMARY -->

            <div class="summary">

                <div>
                    <span>
                        Игра
                    </span>

                    <strong id="summaryGame">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Пакет
                    </span>

                    <strong id="summaryPackage">
                        —
                    </strong>
                </div>


                <div class="total">

                    <span>
                        Итого
                    </span>

                    <strong id="summaryPrice">
                        0 сум
                    </strong>

                </div>

            </div>


            <!-- BUY BUTTON -->

            <button
                class="buy-button"
                onclick="createOrder()"
            >
                Купить
            </button>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button class="nav-item active">

            <span>
                🏠
            </span>

            <small>
                Главная
            </small>

        </button>


        <button
            class="nav-item"
            onclick="showOrders()"
        >

            <span>
                📦
            </span>

            <small>
                Заказы
            </small>

        </button>


        <button
            class="nav-item"
            onclick="showHelp()"
        >

            <span>
                ❓
            </span>

            <small>
                Помощь
            </small>

        </button>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
