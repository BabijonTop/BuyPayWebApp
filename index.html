<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>BuyPay</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css?v=24">
</head>

<body>

<div class="container">

    <header class="hero">

        <div class="hero-glow"></div>

        <div class="logo">BuyPay</div>

        <h1>Игровая валюта</h1>

        <p id="welcomeText">Xush kelibsiz!</p>

        <div class="balance-card">

            <div class="balance-top">

                <span>💰 Баланс</span>

                <button
                    type="button"
                    class="balance-refresh"
                    id="balanceRefresh"
                >
                    ↻
                </button>

            </div>

            <div
                id="balanceAmount"
                class="balance-amount"
            >
                0 сум
            </div>

            <button
                type="button"
                id="depositButton"
                class="deposit-button"
                onclick="testDepositButton()"
            >
                ➕ Пополнить баланс
            </button>

        </div>

    </header>


    <section class="step-section active-step">

        <div class="step-title">

            <span class="step-number">1</span>

            <div>
                <h2>Выберите игру</h2>
                <p>Выберите игру для покупки</p>
            </div>

        </div>


        <div class="games">

            <button
                class="game-card"
                type="button"
                onclick="selectGame('PUBG Mobile')"
            >
                <div class="game-icon">🎯</div>

                <div class="game-info">
                    <strong>PUBG Mobile</strong>
                    <span>UC</span>
                </div>

                <div class="arrow">›</div>
            </button>


            <button
                class="game-card"
                type="button"
                onclick="selectGame('Mobile Legends')"
            >
                <div class="game-icon">⚔️</div>

                <div class="game-info">
                    <strong>Mobile Legends</strong>
                    <span>Diamonds</span>
                </div>

                <div class="arrow">›</div>
            </button>


            <button
                class="game-card"
                type="button"
                onclick="selectGame('Free Fire')"
            >
                <div class="game-icon">🔥</div>

                <div class="game-info">
                    <strong>Free Fire</strong>
                    <span>Diamonds</span>
                </div>

                <div class="arrow">›</div>
            </button>


            <button
                class="game-card"
                type="button"
                onclick="selectGame('Brawl Stars')"
            >
                <div class="game-icon">⭐</div>

                <div class="game-info">
                    <strong>Brawl Stars</strong>
                    <span>Gems</span>
                </div>

                <div class="arrow">›</div>
            </button>

        </div>

    </section>


    <section
        class="step-section hidden-section"
        id="packageSection"
    >

        <div class="step-title">

            <span class="step-number">2</span>

            <div>
                <h2>Выберите валюту</h2>
                <p id="selectedGame">
                    Сначала выберите игру
                </p>
            </div>

        </div>

        <div id="packages"></div>

    </section>


    <section
        class="step-section hidden-section"
        id="playerSection"
    >

        <div class="step-title">

            <span class="step-number">3</span>

            <div>
                <h2>ID игрока</h2>
                <p>Введите ID аккаунта</p>
            </div>

        </div>


        <div class="input-box">

            <label for="playerId">
                🆔 ID игрока
            </label>

            <input
                id="playerId"
                type="text"
                inputmode="numeric"
                placeholder="Например: 5123456789"
            >

        </div>

    </section>


    <section
        class="step-section hidden-section"
        id="summarySection"
    >

        <div class="step-title">

            <span class="step-number">4</span>

            <div>
                <h2>Ваш заказ</h2>
                <p>Проверьте данные перед покупкой</p>
            </div>

        </div>


        <div class="order-card">

            <div class="order-row">
                <span>🎮 Игра</span>
                <strong id="summaryGame">—</strong>
            </div>

            <div class="order-row">
                <span>💎 Пакет</span>
                <strong id="summaryPackage">—</strong>
            </div>

            <div class="order-row">
                <span>🆔 ID игрока</span>
                <strong id="summaryPlayer">—</strong>
            </div>

            <div class="order-total">
                <span>К оплате</span>
                <strong id="summaryPrice">
                    0 сум
                </strong>
            </div>

        </div>


        <button
            id="buyButton"
            class="buy-button"
            type="button"
            onclick="createOrder()"
        >
            🛒 КУПИТЬ
        </button>

    </section>

</div>


<nav class="bottom-nav">

    <button
        type="button"
        onclick="showOrders()"
    >
        📦
        <span>Мои заказы</span>
    </button>


    <button
        type="button"
        onclick="showDepositHistory()"
    >
        💰
        <span>Баланс</span>
    </button>


    <button
        type="button"
        onclick="showHelp()"
    >
        ❓
        <span>Помощь</span>
    </button>

</nav>


<script src="script.js?v=24"></script>

</body>

</html>
